[project]
name = "streamflow"
version = "0.1.5"
description = "Multi-platform video streaming utilities for Python"
readme = "README.md"
authors = [
    { name = "masudranaxpert", email = "masudranaxpert@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpcloak>=1.6.6",
    "rich>=15.0.0",
    "pycryptodome>=3.20.0",
]

[project.scripts]
streamflow = "streamflow.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real platform APIs (network required)"]

[tool.uv.build-backend]
module-name = "streamflow"
module-root = ""

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"
