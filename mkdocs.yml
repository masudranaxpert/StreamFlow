site_name: StreamFlow
site_description: Video streaming and upload platform library for Python
site_url: https://YOUR_USERNAME.github.io/streamflow/

repo_name: YOUR_USERNAME/streamflow
repo_url: https://github.com/YOUR_USERNAME/streamflow

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - content.code.annotate

plugins:
  - search:
      lang:
        - en

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick Start: quickstart.md
  - Platforms:
      - Overview: platforms/index.md
      - StreamEmbed: platforms/streamembed.md
      - VOE: platforms/voe.md
      - Anonstream: platforms/anonstream.md
      - Byse: platforms/byse.md
      - Vidara: platforms/vidara.md
  - API Reference:
      - Overview: api/index.md
      - StreamEmbed API: api/streamembed.md
      - VOE API: api/voe.md
  - Proxy Configuration: proxy.md
  - CLI Usage: cli.md